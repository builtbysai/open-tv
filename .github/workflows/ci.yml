name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    needs: check
    env:
      PW_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      # A local control relay, so the phone-and-TV tests (e2e/remote.spec.ts) run too.
      - run: npm ci
        working-directory: control
      - name: Start the control relay
        working-directory: control
        run: |
          npx wrangler dev --port 8787 --var ALLOWED_ORIGINS:"*" > "$RUNNER_TEMP/relay.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/health && break; sleep 2; done
      - run: npm run build
        env:
          VITE_CONTROL_RELAY: ws://127.0.0.1:8787
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Smoke test against wrangler dev
        run: |
          npx wrangler dev --port 8787 --var ALLOWED_ORIGINS:"*" > "$RUNNER_TEMP/relay.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/health && break; sleep 2; done
          node test/smoke.mjs
  android:
    # Compiles the TV app without any extension pack or secret, so it is safe on pull requests.
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: ./gradlew --no-daemon assembleDebug
        working-directory: android
