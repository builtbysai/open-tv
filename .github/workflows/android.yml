name: Android APK
# Builds the Google TV APK with an extension pack bundled in. Run by hand only: nothing here
# should ever react to pull requests, because this job can read secrets.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Secrets, never echoed. EXTENSION_URL: where to download the pack (a .tgz holding
      # extension.json and an optional extension-data folder). APK_PASSPHRASE: encrypts the
      # APK before it is uploaded, because artifacts of a public repository are downloadable
      # by anyone signed in to GitHub and the APK contains the pack.
      # EXTENSION_DELETE_URL (optional): called at the end to remove a temporary upload.
      EXTENSION_URL: ${{ secrets.EXTENSION_URL }}
      EXTENSION_DELETE_URL: ${{ secrets.EXTENSION_DELETE_URL }}
      APK_PASSPHRASE: ${{ secrets.APK_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Require the secrets
        run: |
          set +x
          [ -n "$EXTENSION_URL" ] || { echo "Set the EXTENSION_URL secret."; exit 1; }
          [ -n "$APK_PASSPHRASE" ] || { echo "Set the APK_PASSPHRASE secret."; exit 1; }
      - name: Download the extension pack
        run: |
          set +x
          pack="$RUNNER_TEMP/pack"
          mkdir -p "$pack"
          curl --fail --silent --location --retry 3 --max-time 300 \
            --output "$RUNNER_TEMP/pack.tgz" "$EXTENSION_URL" \
            || { echo "Could not download the pack."; exit 1; }
          tar -xzf "$RUNNER_TEMP/pack.tgz" -C "$pack"
          rm -f "$RUNNER_TEMP/pack.tgz"
          [ -f "$pack/extension.json" ] || { echo "The pack has no extension.json."; exit 1; }
      - run: npm ci
      - name: Build the APK with the pack inside
        run: npm run android:debug -- --extension "$RUNNER_TEMP/pack"
      - name: Encrypt the APK
        run: |
          set +x
          cd artifacts/android
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:APK_PASSPHRASE \
            -in open-tv-google-tv-preview.apk -out open-tv-google-tv-preview.apk.enc
          rm open-tv-google-tv-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: open-tv-apk-encrypted
          path: |
            artifacts/android/open-tv-google-tv-preview.apk.enc
            artifacts/android/BUILD_INFO.json
          retention-days: 1
      - name: Remove the pack
        if: always()
        run: |
          set +x
          rm -rf "$RUNNER_TEMP/pack" dist/extension.json dist/extension-data
          if [ -n "$EXTENSION_DELETE_URL" ]; then
            curl --silent --max-time 60 -X DELETE "$EXTENSION_DELETE_URL" >/dev/null || true
          fi
