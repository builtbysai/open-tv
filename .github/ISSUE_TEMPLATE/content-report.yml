name: Content listing concern
description: Report a listing, classification, rights concern or broken stream without personal information.
title: "[Content report] "
body:
  - type: markdown
    attributes:
      value: "This issue is PUBLIC. Do not include personal contact information, account credentials, private viewing details or credential-bearing URLs. For a formal copyright notice, use the private contact described in the app's Content reports & copyright page."
  - type: input
    id: content_id
    attributes:
      label: Content reference
      description: Use the opaque ot- listing ID; leave private/personal sources out of public issues.
  - type: input
    id: source_id
    attributes:
      label: Public source reference
  - type: dropdown
    id: reason
    attributes:
      label: Reason
      options:
        - Copyright or distribution rights
        - Incorrect age classification
        - Broken or misleading stream
        - Privacy or safety concern
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public report acknowledgement
      options:
        - label: I have not included personal information, private activity or credentials. This is a listing report, not a formal DMCA notice.
          required: true
